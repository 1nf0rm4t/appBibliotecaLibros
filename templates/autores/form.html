{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h2>{{ 'Editar' if autor else 'Nuevo' }} Autor</h2>
</div>

<form method="POST" class="form">
    <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" value="{{ autor.nombre if autor else '' }}" required>
    </div>
    
    <div class="form-group">
        <label for="biografia">Biografía</label>
        <textarea id="biografia" name="biografia" rows="4">{{ autor.biografia if autor else '' }}</textarea>
    </div>
    
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{{ url_for('autores_list') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}

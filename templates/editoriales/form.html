{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h2>{{ 'Editar' if editorial else 'Nueva' }} Editorial</h2>
</div>

<form method="POST" class="form">
    <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" value="{{ editorial.nombre if editorial else '' }}" required>
    </div>
    
    <div class="form-group">
        <label for="pais">País</label>
        <input type="text" id="pais" name="pais" value="{{ editorial.pais if editorial else '' }}">
    </div>
    
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{{ url_for('editoriales_list') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
